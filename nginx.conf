# ============================================================
# DealFlow AI — nginx.conf
# ============================================================

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ─── Logging ───────────────────────────────────────
    log_format  json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"bytes":$body_bytes_sent,'
            '"referer":"$http_referer",'
            '"ua":"$http_user_agent",'
            '"request_id":"$http_x_request_id",'
            '"upstream_rt":"$upstream_response_time",'
            '"rt":"$request_time"'
        '}';

    access_log  /var/log/nginx/access.log json_combined buffer=16k flush=2s;

    # ─── Performance ───────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  75;
    keepalive_requests 1000;
    types_hash_max_size 4096;

    # ─── Compression ───────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ─── Security Headers (global) ─────────────────────
    add_header X-Frame-Options           "DENY"            always;
    add_header X-Content-Type-Options    "nosniff"         always;
    add_header X-XSS-Protection          "1; mode=block"   always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # ─── Rate Limiting Zones ───────────────────────────
    limit_req_zone  $binary_remote_addr  zone=api_global:10m    rate=60r/m;
    limit_req_zone  $binary_remote_addr  zone=auth_zone:5m      rate=10r/m;
    limit_req_zone  $binary_remote_addr  zone=webhook_zone:5m   rate=30r/m;
    limit_conn_zone $binary_remote_addr  zone=conn_limit:10m;

    # ─── Upstream (API service) ─────────────────────────
    upstream api_backend {
        server api:3001;
        keepalive 32;
    }

    # ─── Server block ──────────────────────────────────
    include /etc/nginx/conf.d/*.conf;
}
