# ============================================================
# DealFlow AI — site config (conf.d/dealflow.conf)
# Replace YOUR_DOMAIN with your actual domain.
# TLS: place fullchain.pem + privkey.pem in docker/nginx/ssl/
# ============================================================

# ─── HTTP → HTTPS redirect ─────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # Let's Encrypt challenge (if using certbot)
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS ─────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2  on;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # ─── TLS ─────────────────────────────────────────
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ─── Connection limits ───────────────────────────
    limit_conn conn_limit 30;

    client_max_body_size 20m;
    client_body_timeout  30s;
    client_header_timeout 30s;

    # ─── Static Frontend ─────────────────────────────
    # Serves dealflow_ai_platform.html directly (no build step needed)
    root /usr/share/nginx/html;
    index dealflow_ai_platform.html index.html;

    location / {
        try_files $uri $uri/ /dealflow_ai_platform.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Static assets (CSS/JS/fonts if split out later)
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─── Health check (bypass rate limit) ────────────
    location = /health {
        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        access_log         off;
    }

    # ─── Auth endpoints (tighter rate limiting) ──────
    location /api/auth/ {
        limit_req zone=auth_zone burst=10 nodelay;
        limit_req_status 429;
        proxy_pass         http://api_backend;
        include            /etc/nginx/conf.d/proxy_params.conf;
    }

    # ─── Webhook endpoints ───────────────────────────
    location /api/webhooks/ {
        limit_req zone=webhook_zone burst=20 nodelay;
        limit_req_status 429;
        proxy_pass         http://api_backend;
        include            /etc/nginx/conf.d/proxy_params.conf;
        # Twilio requires raw body for signature verification
        proxy_request_buffering off;
    }

    # ─── API (all other routes) ──────────────────────
    location /api/ {
        limit_req zone=api_global burst=30 nodelay;
        limit_req_status 429;
        proxy_pass         http://api_backend;
        include            /etc/nginx/conf.d/proxy_params.conf;
    }

    # ─── Block dot-files ─────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }
}
